@let c = content();
<section class="why-us" [id]="anchor" [attr.aria-labelledby]="anchor + '-title'">
  <div class="why-us__inner">
    <app-section-heading [heading]="c" [titleId]="anchor + '-title'" />

    <ul class="why-us__grid" role="list">
      @for (id of ids; track id) {
        <li class="why-us__card">
          <span class="why-us__icon">
            <app-icon [name]="icons[id]" />
          </span>
          <h3 class="why-us__card-title">{{ c.items[id].title }}</h3>
          <p class="why-us__card-text">{{ c.items[id].text }}</p>
        </li>
      }
    </ul>
  </div>
</section>
