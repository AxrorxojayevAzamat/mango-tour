@let c = content();
<section class="services" [id]="anchor" [attr.aria-labelledby]="anchor + '-title'">
  <div class="services__inner">
    <div class="services__intro">
      <app-section-heading appReveal [heading]="c" [titleId]="anchor + '-title'" />
    </div>

    <ul class="services__list" role="list">
      @for (id of ids; track id) {
        <li class="services__item" appReveal [revealDelay]="$index * 70">
          <span class="services__icon">
            <app-icon [name]="icons[id]" />
          </span>
          <div class="services__body">
            <h3 class="services__title">{{ c.items[id].title }}</h3>
            <p class="services__text">{{ c.items[id].text }}</p>
          </div>
        </li>
      }
    </ul>
  </div>
</section>
