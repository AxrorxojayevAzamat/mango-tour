@let c = content();
<a class="home-page__skip" [href]="'/' + lang() + '#main'">{{ c.a11y.skipToContent }}</a>

<app-header [lang]="lang()" [nav]="c.nav" [(menuOpen)]="menuOpen" />

<main class="home-page__main" id="main" tabindex="-1" [inert]="menuOpen()">
  <app-hero [lang]="lang()" [content]="c.hero" />

  <!-- TEMPORARY: replaced by real section components in stage 4. -->
  @for (section of pendingSections(); track section.id) {
    <section
      class="home-page__pending"
      [id]="section.id"
      [attr.aria-labelledby]="section.id + '-title'"
    >
      <p class="home-page__eyebrow">{{ section.heading.eyebrow }}</p>
      <h2 class="home-page__title" [id]="section.id + '-title'">{{ section.heading.title }}</h2>
      <p class="home-page__subtitle">{{ section.heading.subtitle }}</p>
    </section>
  }
</main>

<app-footer
  [lang]="lang()"
  [content]="c.footer"
  [nav]="c.nav"
  [messengerLabels]="c.floating"
  [inert]="menuOpen()"
/>
