@let c = content();
<a class="home-page__skip" [href]="'/' + lang() + '#main'">{{ c.a11y.skipToContent }}</a>

<app-header [lang]="lang()" [nav]="c.nav" [(menuOpen)]="menuOpen" />

<main class="home-page__main" id="main" tabindex="-1" [inert]="menuOpen()">
  <app-hero [lang]="lang()" [content]="c.hero" />
  <app-why-us [content]="c.whyUs" />
  <app-services [content]="c.services" />
  <app-reasons [content]="c.reasons" />
  <app-destinations kind="cities" [lang]="lang()" [content]="c.cities" />
  <app-destinations kind="countries" [lang]="lang()" [content]="c.countries" />
  <app-gallery [content]="c.gallery" />

  <app-lead-form
    [lang]="lang()"
    [content]="c.leadForm"
    [cities]="c.cities"
    [countries]="c.countries"
  />

  <app-faq [content]="c.faq" />
</main>

<app-footer
  [lang]="lang()"
  [content]="c.footer"
  [nav]="c.nav"
  [messengerLabels]="c.floating"
  [inert]="menuOpen()"
/>

<app-floating-contacts [content]="c.floating" [hidden]="menuOpen()" />
