      :root {

      }
      body {
        display: grid;

      }
      .code {
        color: #ea8430;
        font-size: clamp(3.5rem, 12vw, 6rem);
        font-weight: 800;
        line-height: 1;
      }
      p {
        color: #bfb5a3;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }
      a {
        padding: 0.75rem 1.25rem;
        border: 1px solid rgb(246 233 209 / 24%);
        border-radius: 999px;
        color: #f6e9d1;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        border-color: #ea8430;
